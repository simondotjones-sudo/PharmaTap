[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[redirects]]
  from = "/register"
  to = "/workspace.html"
  status = 200
[[redirects]]
  from = "/register/"
  to = "/workspace.html"
  status = 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
